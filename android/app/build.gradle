plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.resenhabr.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.resenhabr.app'
        minSdk 24
        targetSdk 34
        // Para lançar uma atualização: aumente o versionCode (e o versionName). O app instalado compara com
        // android/release.json (servido em /api/app/android) e oferece baixar a nova versão.
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'APP_URL', '"https://resenhabr.com.br/app"'
        buildConfigField 'String', 'UPDATE_URL', '"https://resenhabr.com.br/api/app/android"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // a chave vem do GitHub Actions (ver .github/workflows/android.yml); nunca fica no repositório aberta
            def ks = System.getenv('ANDROID_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('ANDROID_KEY_PASS')
                keyAlias 'resenha'
                keyPassword System.getenv('ANDROID_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
