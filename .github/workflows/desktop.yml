# Gera o instalador do app de desktop para Windows a cada mudança em desktop/ e publica a versão
# (desktop/package.json -> "version") em Releases deste repositório. Os apps instalados olham
# essas Releases e se atualizam sozinhos.
# Versão já publicada não é sobrescrita: para lançar uma atualização, aumente o "version".
name: App de desktop (Windows)

on:
  push:
    branches: [main, claude/screen-sharing-app-w2m6ft]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write # criar a Release com o instalador

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Ver se esta versão já foi publicada
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # rascunho parado (execução interrompida) conta como incompleto
          ASSETS=$(gh release view "$TAG" --json assets,isDraft --jq 'if .isDraft then "rascunho" else ([.assets[].name] | join(",")) end' 2>/dev/null || echo "__nenhuma__")
          if [ "$ASSETS" = "__nenhuma__" ]; then
            echo "Versão $TAG ainda não publicada: vai publicar."
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          elif echo "$ASSETS" | grep -q "\.exe" && echo "$ASSETS" | grep -q "latest.yml"; then
            echo "Versão $TAG já publicada e completa: só gera o instalador. Para lançar, aumente o version."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "Versão $TAG incompleta ($ASSETS): apagando para publicar de novo."
            gh release delete "$TAG" --cleanup-tag --yes
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      # O empacotador envia para um RASCUNHO (evita a corrida de dois envios criando a mesma
      # Release); depois o rascunho é publicado de uma vez, já com todos os arquivos.
      - name: Gerar instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish ${{ steps.rel.outputs.publish == 'yes' && 'always' || 'never' }}

      - name: Publicar a versão
        if: steps.rel.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name'
          gh release edit "$TAG" --draft=false --latest --target "$GITHUB_SHA" --title "Resenha $TAG" \
            --notes "App de desktop do Resenha para Windows. Baixe e abra o **Resenha-Setup-${TAG#v}.exe**. Os outros arquivos são usados pela atualização automática."

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Resenha-Windows
          path: desktop/dist/*.exe
          retention-days: 30
          if-no-files-found: error
