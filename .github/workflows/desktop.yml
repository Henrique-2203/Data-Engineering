# Gera o instalador do app de desktop para Windows a cada mudança em desktop/ e publica a versão
# (desktop/package.json -> "version") em Releases deste repositório. Os apps instalados olham
# essas Releases e se atualizam sozinhos.
# Versão já publicada não é sobrescrita: para lançar uma atualização, aumente o "version".
name: App de desktop (Windows)

on:
  push:
    branches: [main, claude/screen-sharing-app-w2m6ft]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write # criar a Release com o instalador

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador e publicar a versão
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Versão $(node -p "require('./package.json').version")"
          npx electron-builder --win --publish always

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Resenha-Windows
          path: desktop/dist/*.exe
          retention-days: 30
          if-no-files-found: error
