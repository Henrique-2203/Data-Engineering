<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data:; style-src 'unsafe-inline'; script-src 'self'" />
<title>Resenha overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', Inter, system-ui, sans-serif; user-select: none; }
  #root { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 2px; box-sizing: border-box; }
  body.bottom #root { justify-content: flex-end; }
  .chip { align-self: flex-start; font-size: 12px; font-weight: 700; color: #c9cdd6; background: rgba(10, 12, 16, 0.72); padding: 3px 10px; border-radius: 99px; }
  .p { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 99px; background: rgba(10, 12, 16, 0.62); color: #c9cdd6; width: fit-content; max-width: 100%; box-sizing: border-box; border: 2px solid transparent; transition: background .12s, border-color .12s; }
  .p.speaking { background: rgba(10, 12, 16, 0.85); border-color: #3ddc97; color: #fff; box-shadow: 0 0 14px rgba(61, 220, 151, 0.55); }
  .av { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; }
  .icons { font-size: 13px; }
  .live { font-size: 10px; font-weight: 900; color: #fff; background: #f04d5e; border-radius: 4px; padding: 1px 4px; }
  .burst { font-size: 13px; font-weight: 700; color: #ffd23f; white-space: nowrap; animation: pop .25s ease-out; }
  .toast { align-self: flex-start; font-size: 13px; font-weight: 700; color: #fff; background: rgba(124, 58, 237, 0.85); padding: 5px 12px; border-radius: 99px; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="overlay-ui.js"></script>
</body>
</html>
