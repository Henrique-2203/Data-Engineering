<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Resenha</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; background: #111318; color: #a7adbb; font: 15px system-ui, 'Segoe UI', sans-serif; text-align: center; }
      img { width: 72px; height: 72px; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(0.92); opacity: 0.7; } }
      strong { color: #e6e8ee; font-size: 18px; }
      small { max-width: 340px; }
    </style>
  </head>
  <body>
    <img src="assets/icon.png" alt="" />
    <strong>Resenha</strong>
    <span id="status">Conectando…</span>
    <small id="detail"></small>
    <script>
      window.setStatus = (status, detail) => {
        document.getElementById('status').textContent = status;
        document.getElementById('detail').textContent = detail || '';
      };
    </script>
  </body>
</html>
