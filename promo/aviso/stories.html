<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Resenha — aviso de pausa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07080b; font-family: Inter, 'Noto Color Emoji', sans-serif; color: #fff; }
  #s { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(160px); opacity: .45; }
  .grid { position: absolute; inset: 0; opacity: .45;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 72px 72px; }
  .t { position: absolute; left: 70px; right: 70px; text-align: center; font-weight: 900; letter-spacing: -3px; line-height: 1.02;
    text-shadow: 0 10px 0 rgba(0,0,0,.45); }
  .g { color: #3ddc97; }
  .sub { position: absolute; left: 90px; right: 90px; text-align: center; font-weight: 800; font-size: 46px; line-height: 1.25; color: rgba(255,255,255,.88); }
  .pill { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 18px 40px; border-radius: 999px; background: #3ddc97; color: #06281a; font-weight: 900; font-size: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 60px rgba(61,220,151,.45); }
  img.st { position: absolute; filter: drop-shadow(0 30px 50px rgba(0,0,0,.6)); }
  .brand { position: absolute; left: 0; right: 0; bottom: 210px; display: flex; justify-content: center; align-items: center; gap: 18px; font-weight: 900; font-size: 40px; color: rgba(255,255,255,.9); }
  .brand .ic { width: 64px; height: 64px; }
  .brand .ic svg { width: 100%; height: 100%; }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(61,220,151,.45), transparent 65%); }
  .vote { position: absolute; left: 140px; right: 140px; text-align: center; font-weight: 900; font-size: 44px; color: #3ddc97; }
  .card { position: absolute; left: 90px; right: 90px; border-radius: 40px; padding: 38px 44px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.12);
    backdrop-filter: blur(10px); box-shadow: 0 30px 60px rgba(0,0,0,.35); }
  .row { display: flex; gap: 26px; align-items: center; font-weight: 800; font-size: 40px; line-height: 1.25; color: rgba(255,255,255,.92); }
  .row + .row { margin-top: 30px; }
  .row .e { flex: 0 0 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; font-size: 40px; background: rgba(61,220,151,.16); }
  .row small { display: block; font-weight: 600; font-size: 32px; color: rgba(255,255,255,.6); margin-top: 4px; }
  .zz { position: absolute; font-weight: 900; color: #3ddc97; text-shadow: 0 6px 0 rgba(0,0,0,.4); }
  .tag { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 14px 32px; border-radius: 999px; border: 2px solid rgba(61,220,151,.5);
    color: #3ddc97; font-weight: 800; font-size: 34px; letter-spacing: 1px; background: rgba(61,220,151,.08); }
</style>
</head>
<body>
<div id="s">
  <div class="blob" style="width:900px;height:900px;background:#3ddc97;left:-300px;top:-200px"></div>
  <div class="blob" style="width:800px;height:800px;background:#7c3aed;right:-300px;top:700px"></div>
  <div class="blob" style="width:700px;height:700px;background:#ffcc33;left:-200px;bottom:-250px;opacity:.25"></div>
  <div class="grid"></div>
  <div id="c"></div>
  <div class="brand"><span class="ic" id="ic"></span>resenhabr.com.br</div>
</div>
<script type="module">
const n = new URLSearchParams(location.search).get('n') ?? '1';
const F = (x) => `../out/mascote/figurinhas/resenha-${x}.png`;
const icons = await (await fetch('../out/reels/icons.json')).json();
document.getElementById('ic').innerHTML = icons.find((i) => i.id === 'classic').svg;
const S = {
  // 1. o aviso: o mascote tirando uma soneca enquanto a equipe cuida do servidor
  1: `
    <div class="tag" style="top:250px">AVISO DA EQUIPE</div>
    <div class="t" style="top:360px;font-size:118px">O Resenha deu<br/>uma <span class="g">pausa</span></div>
    <div class="sub" style="top:640px">Estamos cuidando do nosso servidor<br/>para voltar <b class="g">mais leve e estável</b>.</div>
    <div class="glow" style="width:1000px;height:1000px;left:40px;top:640px"></div>
    <img class="st" src="${F('dormindo')}" style="width:660px;left:210px;top:800px" />
    <div class="pill" style="top:1500px">previsão de volta: início de dezembro</div>`,
  // 2. o que muda para quem usa
  2: `
    <div class="t" style="top:260px;font-size:104px">Fica tranquilo <span class="g">💚</span></div>
    <div class="sub" style="top:420px">o que você precisa saber:</div>
    <div class="card" style="top:560px">
      <div class="row"><span class="e">🔒</span><span>Contas, mensagens e servidores estão seguros<small>nada foi perdido</small></span></div>
      <div class="row"><span class="e">📱</span><span>Não precisa reinstalar nada<small>quando voltar, é só abrir o app</small></span></div>
      <div class="row"><span class="e">⚡</span><span>Vai voltar mais rápido<small>o app vai abrir mais leve no celular e no PC</small></span></div>
    </div>
    <img class="st" src="${F('coracao')}" style="width:400px;left:340px;top:1080px" />
    <div class="pill" style="top:1500px">avisamos aqui assim que voltar 🔔</div>`,
  // 3. para postar quando o Resenha voltar
  3: `
    <div class="tag" style="top:250px">ESTAMOS DE VOLTA</div>
    <div class="t" style="top:360px;font-size:150px">Voltamos<span class="g">!</span></div>
    <div class="sub" style="top:560px">O Resenha está no ar de novo,<br/><b class="g">mais leve e mais rápido</b>.</div>
    <div class="glow" style="width:1000px;height:1000px;left:40px;top:620px"></div>
    <img class="st" src="${F('fone')}" style="width:260px;left:60px;top:800px;transform:rotate(-10deg)" />
    <img class="st" src="${F('joinha')}" style="width:560px;left:260px;top:780px" />
    <img class="st" src="${F('oculos')}" style="width:250px;right:60px;top:820px;transform:rotate(9deg)" />
    <div class="sub" style="top:1330px;font-size:40px;color:rgba(255,255,255,.75)">obrigado pela paciência, galera 💚</div>
    <div class="pill" style="top:1500px">bora pra call? 🎧</div>`,
};
document.getElementById('c').innerHTML = S[n];
await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
await document.fonts.ready;
window.ready = true;
</script>
</body>
</html>
