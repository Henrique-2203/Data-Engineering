<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Mascote do Resenha — stories</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07080b; font-family: Inter, 'Noto Color Emoji', sans-serif; color: #fff; }
  #s { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(160px); opacity: .45; }
  .grid { position: absolute; inset: 0; opacity: .45;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 72px 72px; }
  .t { position: absolute; left: 70px; right: 70px; text-align: center; font-weight: 900; letter-spacing: -3px; line-height: 1.02;
    text-shadow: 0 10px 0 rgba(0,0,0,.45); }
  .g { color: #3ddc97; }
  .sub { position: absolute; left: 90px; right: 90px; text-align: center; font-weight: 800; font-size: 46px; line-height: 1.25; color: rgba(255,255,255,.88); }
  .pill { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 18px 40px; border-radius: 999px; background: #3ddc97; color: #06281a; font-weight: 900; font-size: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 60px rgba(61,220,151,.45); }
  img.st { position: absolute; filter: drop-shadow(0 30px 50px rgba(0,0,0,.6)); }
  .brand { position: absolute; left: 0; right: 0; bottom: 210px; display: flex; justify-content: center; align-items: center; gap: 18px; font-weight: 900; font-size: 40px; color: rgba(255,255,255,.9); }
  .brand .ic { width: 64px; height: 64px; }
  .brand .ic svg { width: 100%; height: 100%; }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(61,220,151,.45), transparent 65%); }
  .vote { position: absolute; left: 140px; right: 140px; text-align: center; font-weight: 900; font-size: 44px; color: #3ddc97; }
</style>
</head>
<body>
<div id="s">
  <div class="blob" style="width:900px;height:900px;background:#3ddc97;left:-300px;top:-200px"></div>
  <div class="blob" style="width:800px;height:800px;background:#7c3aed;right:-300px;top:700px"></div>
  <div class="blob" style="width:700px;height:700px;background:#ffcc33;left:-200px;bottom:-250px;opacity:.25"></div>
  <div class="grid"></div>
  <div id="c"></div>
  <div class="brand"><span class="ic" id="ic"></span>resenhabr.com.br</div>
</div>
<script type="module">
const n = new URLSearchParams(location.search).get('n') ?? '1';
const F = (x) => `../out/mascote/figurinhas/resenha-${x}.png`;
const icons = await (await fetch('../out/reels/icons.json')).json();
document.getElementById('ic').innerHTML = icons.find((i) => i.id === 'classic').svg;
const S = {
  // 1. teaser: ele espiando pela borda
  1: `
    <div class="t" style="top:270px;font-size:150px">Psiu… 👀</div>
    <div class="sub" style="top:470px">tem alguém novo chegando<br/>na <b class="g">resenha</b></div>
    <div class="glow" style="width:1100px;height:1100px;left:-420px;top:820px"></div>
    <img class="st" src="${F('curioso')}" style="width:720px;left:-40px;top:820px" />
    <div class="pill" style="top:1540px">toque pra conhecer →</div>`,
  // 2. revelação: o mascote + as outras poses em volta
  2: `
    <div class="t" style="top:250px;font-size:160px">Prazer! <span class="g">💚</span></div>
    <div class="sub" style="top:450px">eu sou o <b class="g">mascote do Resenha</b></div>
    <div class="glow" style="width:1000px;height:1000px;left:40px;top:500px"></div>
    <img class="st" src="${F('oculos')}" style="width:250px;left:40px;top:600px;transform:rotate(-10deg)" />
    <img class="st" src="${F('fone')}" style="width:250px;right:40px;top:620px;transform:rotate(9deg)" />
    <img class="st" src="${F('joinha')}" style="width:600px;left:240px;top:700px" />
    <img class="st" src="${F('coracao')}" style="width:240px;left:30px;top:1170px;transform:rotate(8deg)" />
    <img class="st" src="${F('dormindo')}" style="width:260px;right:30px;top:1190px;transform:rotate(-7deg)" />
    <div class="pill" style="top:1500px">em breve: figurinhas e emojis no app 🎉</div>`,
  // 3. enquete do nome: o espaço do meio fica livre para a enquete do Instagram
  3: `
    <div class="t" style="top:250px;font-size:112px">Me ajuda a escolher<br/>meu <span class="g">nome</span>? 🤔</div>
    <div class="glow" style="width:900px;height:900px;left:90px;top:380px"></div>
    <img class="st" src="${F('bandeira')}" style="width:520px;left:280px;top:560px" />
    <div class="vote" style="top:1110px">vota aqui embaixo 👇</div>
    <div class="sub" style="top:1530px;font-size:36px;color:rgba(255,255,255,.65)">o nome mais votado vira oficial<br/>(e ganha figurinha própria no app)</div>`,
};
document.getElementById('c').innerHTML = S[n];
await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
await document.fonts.ready;
window.ready = true;
</script>
</body>
</html>
