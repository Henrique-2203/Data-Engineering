<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Resenha — Sem eco na transmissão</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07080b; font-family: Inter, 'Noto Color Emoji', sans-serif; color: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(150px); opacity: .5; }
  #grid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 72px 72px; }
  #fx { position: absolute; inset: 0; }
  /* "monitor" com a tela real do app */
  #panel { position: absolute; left: 50px; width: 980px; border-radius: 34px; overflow: hidden; background: #111318;
    box-shadow: 0 40px 120px rgba(0,0,0,.65), 0 0 0 2px rgba(255,255,255,.08), 0 0 90px var(--glow, rgba(61,220,151,.35)); transform-origin: 50% 50%; }
  #panel img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: none; }
  #panel .layer { position: absolute; inset: 0; overflow: hidden; }
  .mark { position: absolute; border: 5px solid #3ddc97; border-radius: 18px; box-shadow: 0 0 30px #3ddc97, inset 0 0 20px rgba(61,220,151,.35); opacity: 0; }
  #cursor { position: absolute; width: 64px; height: 64px; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
  #ripple { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 6px solid #fff; opacity: 0; }
  #burst { position: absolute; left: 0; right: 0; text-align: center; font-size: 260px; opacity: 0; }
  .pill { position: absolute; padding: 10px 26px; border-radius: 999px; font-weight: 900; font-size: 40px; letter-spacing: 1px; }
  #wipe { position: absolute; top: 0; bottom: 0; width: 8px; background: #fff; box-shadow: 0 0 40px #fff, 0 0 80px #3ddc97; opacity: 0; }
  #bigicon { position: absolute; width: 300px; height: 300px; left: 390px; opacity: 0; filter: drop-shadow(0 30px 60px rgba(0,0,0,.6)); }
  #bigicon svg { width: 100%; height: 100%; }
  #sticker { position: absolute; left: 70px; top: 300px; padding: 14px 30px; border-radius: 16px; background: #ff3d7f; font-weight: 900; font-size: 48px; transform-origin: 50% 50%; opacity: 0; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  /* barra de progresso */
  #parts { position: absolute; left: 70px; right: 70px; top: 170px; display: flex; gap: 14px; opacity: 0; }
  .part { flex: 1; }
  .part .bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
  .part .bar i { display: block; height: 100%; width: 0; background: #3ddc97; border-radius: 99px; box-shadow: 0 0 16px #3ddc97; }
  .part span { display: block; margin-top: 10px; font-weight: 800; font-size: 26px; color: rgba(255,255,255,.55); }
  .part.on span { color: #fff; }
  /* legendas */
  #cap { position: absolute; left: 60px; width: 900px; top: 1330px; display: flex; justify-content: center; flex-wrap: wrap; text-align: center; }
  .w { display: inline-block; margin: 0 .2em; font-weight: 900; font-size: 104px; line-height: 1.08; letter-spacing: -2px;
    -webkit-text-stroke: 14px #000; paint-order: stroke fill; text-shadow: 0 10px 0 rgba(0,0,0,.55); transform-origin: 50% 80%; }
  .w.key { color: #3ddc97; }
  /* o que o amigo falou (só dá pra ler com o filtro) */
  .w.q { font-size: 84px; font-style: italic; color: #e8fff4; letter-spacing: -1px; }
  .w.q.key { color: #3ddc97; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6)); pointer-events: none; }
  #end { position: absolute; inset: 0; opacity: 0; }
  #endicon { position: absolute; left: 310px; top: 420px; width: 460px; height: 460px; filter: drop-shadow(0 40px 80px rgba(61,220,151,.45)); }
  #endicon svg { width: 100%; height: 100%; }
  .ring { position: absolute; border-radius: 50%; border: 12px solid #3ddc97; }
  #word { position: absolute; left: 0; right: 0; top: 920px; text-align: center; font-weight: 900; font-size: 170px; letter-spacing: -6px; }
  #free { position: absolute; left: 0; right: 0; top: 1140px; text-align: center; }
  #free b { display: inline-block; padding: 14px 34px; border-radius: 999px; background: #3ddc97; color: #06281a; font-size: 44px; font-weight: 900; }

  /* desenho de como o som vai para a transmissão */
  #diag { position: absolute; left: 50px; width: 980px; top: 300px; height: 1000px; opacity: 0; }
  .node { position: absolute; display: flex; align-items: center; gap: 22px; padding: 26px 34px; border-radius: 30px; background: #151821;
    box-shadow: 0 0 0 3px rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.5); font-weight: 900; font-size: 50px; white-space: nowrap; }
  .node .ic { font-size: 70px; }
  .node small { display: block; font-size: 30px; font-weight: 700; color: rgba(255,255,255,.6); margin-top: 4px; }
  .node.bad { box-shadow: 0 0 0 4px #e5384b, 0 0 60px rgba(229,56,75,.55); }
  .node.good { box-shadow: 0 0 0 4px #3ddc97, 0 0 60px rgba(61,220,151,.55); }
  #diag svg { position: absolute; inset: 0; overflow: visible; }
  .cross { position: absolute; font-size: 170px; opacity: 0; filter: drop-shadow(0 10px 20px rgba(0,0,0,.6)); }
  /* aviso de que o som do "antes" foi recriado */
  #note { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 30px; color: rgba(255,255,255,.85); opacity: 0; }
  #note span { background: rgba(0,0,0,.55); padding: 8px 20px; border-radius: 12px; }
  /* cartão do app de Windows */
  #app { position: absolute; left: 120px; width: 840px; top: 380px; padding: 60px 50px; border-radius: 40px; background: #151821; text-align: center; opacity: 0;
    box-shadow: 0 0 0 3px rgba(61,220,151,.5), 0 0 90px rgba(61,220,151,.35), 0 40px 120px rgba(0,0,0,.6); }
  #app .appicon { width: 220px; height: 220px; margin: 0 auto 30px; }
  #app .appicon svg { width: 100%; height: 100%; }
  #app h2 { font-size: 70px; font-weight: 900; letter-spacing: -2px; }
  #app .ver { display: inline-block; margin-top: 26px; padding: 14px 34px; border-radius: 999px; background: #3ddc97; color: #06281a; font-size: 46px; font-weight: 900; }
  #app p { margin-top: 30px; font-size: 32px; font-weight: 700; color: rgba(255,255,255,.65); line-height: 1.35; }
  .w.echo { color: #ff5a6e !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:#3ddc97"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:#7c3aed"></div>
    <div class="blob" id="b3" style="width:700px;height:700px;background:#ff3d7f"></div>
    <div id="grid"></div>
    <canvas id="fx" width="1080" height="1920"></canvas>
  </div>

  <div id="panel"><div class="layer" id="layerA"></div>
    <div id="marks"></div>
    <canvas id="wave" width="980" height="340" style="position:absolute;left:0;bottom:0;opacity:0"></canvas>
    <div class="pill" id="pillN" style="left:30px;top:26px;opacity:0"></div>
  </div>
  <div id="note"><span>🔁 som recriado para mostrar o eco</span></div>

  <div id="diag">
    <svg id="lines" width="980" height="1000"></svg>
    <div class="node" id="nGame" style="left:40px;top:40px"><span class="ic">🎮</span><div>Jogo<small>o som do jogo</small></div></div>
    <div class="node" id="nCall" style="left:500px;top:40px"><span class="ic">🗣️</span><div>Call<small>a voz dos amigos</small></div></div>
    <div class="node" id="nPc" style="left:190px;top:400px"><span class="ic" id="pcIc">💻</span><div id="pcTxt">Som do PC<small>tudo que toca no PC</small></div></div>
    <div class="node" id="nOut" style="left:170px;top:760px"><span class="ic">📡</span><div id="outTxt">Transmissão</div></div>
    <div class="cross" id="xCall" style="left:620px;top:200px">🚫</div>
  </div>

  <div id="app">
    <div class="appicon" id="appicon"></div>
    <h2>App de Windows</h2>
    <div class="ver">versão 0.3.9 ou mais nova ⬆️</div>
    <p>Já atualiza sozinho. Precisa do Windows 10 (versão 2004) ou mais novo.</p>
  </div>

  <div id="cap"></div>

  <div id="end">
    <div class="ring" id="r1"></div><div class="ring" id="r2"></div>
    <div id="endicon"></div>
    <div id="word">Resenha</div>
    <div id="free"><b>grátis · lista de espera na bio</b></div>
  </div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
</div>
<script type="module">
import { SCENES as SHOTS, CAPTIONS, CUTS, BEAT, DURATION, END, COVER, ECHO, MUSIC } from './timeline.mjs';

const PW = 980;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

const imgs = {};
for (const n of [...new Set(SHOTS.filter((s) => s.img).map((s) => s.img))]) {
  const el = document.createElement('img');
  el.src = `../out/eco/shots/${n}.png`;
  imgs[n] = el;
}
const icons = await (await fetch('../out/reels/icons.json')).json();
const ENV = await (await fetch('../out/eco/env.json')).json();
const iconSvg = (id) => icons.find((i) => i.id === id).svg;
$('endicon').innerHTML = iconSvg('classic');
$('appicon').innerHTML = iconSvg('classic');

const capWords = CAPTIONS.map((c) => {
  const out = [];
  for (const m of c.text.matchAll(/\*([^*]+)\*(\S*)|(\S+)/g)) {
    if (m[1]) {
      m[1].split(' ').forEach((w) => out.push({ w, key: true }));
      out[out.length - 1].w += m[2];
    } else out.push({ w: m[3], key: false });
  }
  return { ...c, words: out };
});

function place(el, r, ph) {
  const W = el.naturalWidth || 2560, H = el.naturalHeight || 1600;
  const s = Math.max(PW / (r[2] * W), ph / (r[3] * H));
  const x = PW / 2 - (r[0] + r[2] / 2) * W * s;
  const y = ph / 2 - (r[1] + r[3] / 2) * H * s;
  el.style.display = 'block';
  el.style.width = `${W}px`;
  el.style.height = `${H}px`;
  el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  return { s, x, y, W, H, map: (px, py) => [x + px * W * s, y + py * H * s] };
}

function drawFx(t) {
  const c = $('fx'), g = c.getContext('2d');
  g.clearRect(0, 0, 1080, 1920);
  for (let i = 0; i < 70; i++) {
    const sp = 20 + (i % 7) * 9;
    const x = (i * 157.3) % 1080 + Math.sin(t * 0.7 + i) * 14;
    const y = 1920 - ((i * 263.1 + t * sp) % 2000);
    const a = 0.15 + 0.35 * ((i * 37) % 10) / 10;
    g.fillStyle = i % 3 === 0 ? `rgba(61,220,151,${a})` : i % 3 === 1 ? `rgba(167,139,250,${a})` : `rgba(255,255,255,${a * 0.8})`;
    g.beginPath();
    g.arc(x, y, 2 + (i % 4), 0, Math.PI * 2);
    g.fill();
  }
}

/** a onda da voz do Matheus: verde = ele falando; vermelha = a mesma voz voltando pela transmissão */
function drawWave(shot, t, ph) {
  const cv = $('wave'), g = cv.getContext('2d');
  cv.style.top = `${ph - 340}px`;
  cv.style.opacity = 1;
  g.clearRect(0, 0, 980, 340);
  const grad = g.createLinearGradient(0, 0, 0, 340);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,.8)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 980, 340);
  const env = ENV.f1, step = 0.02, bars = 64, bw = 980 / bars;
  const idx = Math.floor((t - shot.wave.at) / step);
  const val = (k) => (k >= 0 && k < env.length ? env[k] : 0);
  for (let i = 0; i < bars; i++) {
    const k = idx - (bars - 1 - i);
    const v = val(k);
    const e = shot.wave.echo ? val(k - Math.round(ECHO / step)) * 0.8 : 0;
    const h = Math.min(130, 6 + Math.sqrt(v) * 420);
    const he = Math.min(130, Math.sqrt(e) * 420);
    g.globalAlpha = 0.35 + 0.65 * (i / bars);
    g.fillStyle = '#3ddc97';
    g.fillRect(i * bw + 3, 170 - h, bw - 6, h);
    if (he > 2) {
      g.fillStyle = '#ff4d63';
      g.fillRect(i * bw + 3, 176, bw - 6, he);
    }
  }
  g.globalAlpha = 1;
  g.font = '800 30px Inter, sans-serif';
  g.fillStyle = '#3ddc97';
  g.fillText('🗣️ o Matheus falando', 24, 40);
  if (shot.wave.echo) {
    g.fillStyle = '#ff4d63';
    g.fillText('🔁 a voz dele voltando pela transmissão', 24, 330);
  }
}

/** o desenho: Jogo + Call → Som do PC → Transmissão (antes); no "agora", a call fica de fora */
function drawDiagram(shot, t) {
  const since = t - shot.t0;
  const now = shot.diagram === 'agora';
  const d = $('diag');
  d.style.opacity = clamp(since / 0.25) * (1 - clamp((t - (shot.t1 - 0.12)) / 0.12));
  d.style.transform = `scale(${0.96 + 0.04 * easeOut(clamp(since / 0.4))})`;
  const pop = (id, at) => {
    const k = clamp((since - at) / 0.25);
    $(id).style.opacity = k;
    $(id).style.transform = `scale(${back(k)})`;
  };
  // os dois de baixo ficam centralizados (o texto muda de tamanho)
  for (const id of ['nPc', 'nOut']) $(id).style.left = `${(980 - $(id).offsetWidth) / 2}px`;
  pop('nGame', 0);
  pop('nCall', 0.15);
  pop('nPc', 0.5);
  pop('nOut', 0.8);
  const fixAt = now ? Math.max(0.2, (shot.at ?? shot.t0) - shot.t0) : Infinity;
  const fixed = since >= fixAt;
  $('nCall').className = `node${!now ? ' bad' : ''}`;
  $('nOut').className = `node${now ? (fixed ? ' good' : '') : ' bad'}`;
  $('nPc').className = 'node';
  $('pcIc').textContent = now && fixed ? '💚' : '💻';
  $('pcTxt').innerHTML = now && fixed ? 'App do Resenha<small>manda só o som do jogo</small>' : 'Som do PC<small>tudo que toca no PC</small>';
  $('outTxt').innerHTML = now && fixed ? 'Transmissão<small>✅ sem a voz da call</small>' : now ? 'Transmissão' : 'Transmissão<small>😵 com a voz da call junto</small>';
  const xk = now ? clamp((since - fixAt - 0.3) / 0.2) : 0;
  $('xCall').style.opacity = xk;
  $('xCall').style.transform = `scale(${back(xk)}) rotate(-8deg)`;
  $('nCall').style.filter = now && fixed ? `grayscale(${xk}) brightness(${1 - 0.4 * xk})` : 'none';
  // linhas com "bolinhas de som" andando
  const svg = $('lines');
  const flows = [
    ['M200 190 C200 300 440 300 440 400', '#3ddc97', true],
    ['M700 190 C700 300 540 300 540 400', '#ff4d63', !(now && fixed)],
    ['M490 560 L490 760', now && fixed ? '#3ddc97' : '#ff9f43', true],
  ];
  svg.innerHTML = flows
    .map(([p, c, on], i) => {
      const k = clamp((since - 0.5 - i * 0.2) / 0.3);
      const dots = on
        ? Array.from({ length: 4 }, (_, j) => `<circle r="12" fill="${c}"><animateMotion dur="1s" repeatCount="indefinite" path="${p}" begin="${-((t * 1.2 + j / 4) % 1)}s"/></circle>`).join('')
        : '';
      return `<path d="${p}" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${on ? 'none' : '18 18'}" opacity="${k * (on ? 0.9 : 0.35)}"/>${k > 0.9 ? dots : ''}`;
    })
    .join('');
  // as bolinhas usam o relógio do SVG: congela no tempo t (o render é quadro a quadro)
  svg.pauseAnimations?.();
  svg.setCurrentTime?.(0);
}

window.seek = function seek(t) {
  $('b1').style.transform = `translate(${-200 + Math.sin(t * 0.5) * 140}px, ${200 + Math.cos(t * 0.4) * 120}px)`;
  $('b2').style.transform = `translate(${480 + Math.cos(t * 0.45) * 160}px, ${900 + Math.sin(t * 0.55) * 140}px)`;
  $('b3').style.transform = `translate(${60 + Math.sin(t * 0.6 + 1) * 160}px, ${1350 + Math.cos(t * 0.5) * 120}px)`;
  $('grid').style.transform = `translateY(${(t * 24) % 72}px)`;
  const quiet = MUSIC.quiet.some(([a, b]) => t >= a && t < b);
  const pulse = t >= MUSIC.drop && t < END && !quiet ? Math.exp(-((t % BEAT) / BEAT) * 5) : 0;
  for (const id of ['b1', 'b2', 'b3']) $(id).style.opacity = 0.42 + 0.22 * pulse;
  drawFx(t);

  const shot = SHOTS.find((s) => t >= s.t0 && t < s.t1);
  const panel = $('panel');
  Object.values(imgs).forEach((i) => (i.style.display = 'none'));
  $('layerA').replaceChildren();
  $('marks').replaceChildren();
  ['pillN', 'wave', 'note', 'diag', 'app'].forEach((id) => ($(id).style.opacity = 0));
  if (shot && shot.img && t < END) {
    const ph = shot.ph;
    const top = 830 - ph / 2;
    const since = t - shot.t0;
    const punch = 1 + 0.06 * Math.exp(-since * 12);
    let shake = Math.exp(-since * 18) * 8 * Math.sin(since * 90);
    // no eco, o painel "tremido" a cada vez que a voz volta
    if (shot.shake) {
      const e = ENV.f1[Math.floor((t - shot.wave.at - ECHO) / 0.02)] ?? 0;
      shake += Math.sqrt(e) * 30 * Math.sin(t * 70);
    }
    const intro = t < 0.35 ? easeOut(t / 0.35) : 1;
    panel.style.opacity = intro;
    panel.style.height = `${ph}px`;
    panel.style.top = `${top}px`;
    panel.style.transform = `translate(${shake}px, ${(1 - intro) * 120}px) scale(${punch * lerp(0.92, 1, intro)}) rotate(${Math.sin(t * 0.8) * 0.4}deg)`;
    panel.style.setProperty('--glow', shot.bad ? '#ff4d6388' : '#3ddc9766');
    const el = imgs[shot.img];
    $('layerA').append(el);
    const k = easeIO(clamp(since / (shot.t1 - shot.t0)));
    const r = shot.from.map((v, i) => lerp(v, shot.to[i], k));
    const P = place(el, r, ph);
    if (shot.wave) drawWave(shot, t, ph);
    const label = shot.pill ?? shot.tag;
    if (label) {
      const pn = $('pillN');
      pn.textContent = label;
      pn.style.fontSize = shot.pill ? '40px' : '32px';
      pn.style.background = shot.bad ? '#e5384b' : '#3ddc97';
      pn.style.color = shot.bad ? '#fff' : '#06281a';
      const ta = (shot.tagAt ?? 0.15);
      pn.style.opacity = since > ta ? 1 : 0;
      pn.style.transform = `scale(${back(clamp((since - ta) / 0.2))}) rotate(-3deg)`;
    }
    if (shot.note) {
      $('note').style.opacity = clamp((since - 0.3) / 0.2);
      $('note').style.top = `${top - 70}px`;
    }
    for (const m of shot.marks ?? []) {
      if (t < m.t || t >= m.t1) continue;
      const [x, y] = P.map(m.r[0], m.r[1]);
      const d = document.createElement('div');
      d.className = 'mark';
      const pop = back(clamp((t - m.t) / 0.15));
      const c = shot.bad ? '#ff4d63' : '#3ddc97';
      Object.assign(d.style, { left: `${x}px`, top: `${y}px`, width: `${m.r[2] * P.W * P.s}px`, height: `${m.r[3] * P.H * P.s}px`, opacity: 1, transform: `scale(${0.9 + 0.1 * pop})`, borderColor: c, boxShadow: `0 0 30px ${c}, inset 0 0 20px ${c}55` });
      $('marks').append(d);
    }
  } else {
    panel.style.opacity = 0;
    if (shot?.diagram) drawDiagram(shot, t);
    if (shot?.app) {
      const since = t - shot.t0;
      $('app').style.opacity = clamp(since / 0.2);
      $('app').style.transform = `scale(${0.9 + 0.1 * back(clamp(since / 0.3))})`;
      $('appicon').style.transform = `rotate(${Math.sin(t * 2) * 4}deg)`;
    }
  }

  // ---------- legendas ----------
  const cap = capWords.find((c) => t >= c.t && t < c.end);
  const box = $('cap');
  if (!cap) box.replaceChildren();
  else {
    const out = 1 - clamp((t - (cap.end - 0.07)) / 0.07);
    box.style.top = `${t >= END ? 1290 : shot?.diagram ? 1420 : shot?.app ? 1330 : 1380}px`;
    const row = (delay, extra) =>
      cap.words.map((w, i) => {
        const s = document.createElement('span');
        s.className = `w${w.key ? ' key' : ''}${cap.quote ? ' q' : ''}${extra}`;
        s.textContent = w.w;
        const k = clamp((t - delay - cap.times[Math.min(i, cap.times.length - 1)]) / 0.16);
        const enter = back(clamp((t - delay - cap.t) / 0.16));
        s.style.opacity = k > 0 ? 1 : extra ? 0 : 0.38;
        if (k <= 0) s.style.color = '#fff';
        s.style.transform = `scale(${(0.9 + 0.1 * (k > 0 ? back(k) : 0)) * enter * out}) translateY(${k > 0 ? -8 * Math.sin(Math.PI * k) : 0}px)`;
        return s;
      });
    const kids = row(0, '');
    if (cap.echo) {
      // o eco: a mesma frase voltando em vermelho, menor e atrasada
      const br = document.createElement('div');
      br.style.flexBasis = '100%';
      br.style.height = '10px';
      const e = row(cap.echo, ' echo');
      e.forEach((s) => (s.style.fontSize = '64px'));
      kids.push(br, ...e);
      box.style.top = '1300px';
    }
    box.replaceChildren(...kids);
  }

  const lastCut = CUTS.filter((c) => c <= t).pop() ?? -9;
  $('flash').style.opacity = 0.35 * Math.exp(-(t - lastCut) * 14) * (lastCut > 0 ? 1 : 0);

  // ---------- final ----------
  const ek = clamp((t - END) / 0.3);
  $('end').style.opacity = ek;
  $('endicon').style.transform = `scale(${back(clamp((t - END) / 0.35))}) rotate(${Math.sin(t * 2) * 3}deg)`;
  for (const [id, d] of [['r1', 0], ['r2', 0.25]]) {
    const rk = clamp((t - END - d) / 0.9);
    const size = 300 + rk * 900;
    Object.assign($(id).style, { width: `${size}px`, height: `${size}px`, left: `${540 - size / 2}px`, top: `${650 - size / 2}px`, opacity: (1 - rk) * (t >= END + d ? 1 : 0) });
  }
  $('word').style.transform = `translateY(${(1 - easeOut(clamp((t - END - 0.2) / 0.3))) * 60}px)`;
  $('word').style.opacity = clamp((t - END - 0.2) / 0.2);
  $('free').style.opacity = clamp((t - END - 0.5) / 0.2);
  $('free').style.transform = `scale(${back(clamp((t - END - 0.5) / 0.25))})`;
};

window.DURATION = DURATION;
window.COVER = COVER;
window.ready = Promise.all(Object.values(imgs).map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready);
window.seek(0);
</script>
</body>
